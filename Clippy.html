<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clippy</title>

<!-- The real Clippy: jQuery + clippy.js (authentic Microsoft Office Assistant sprites & animations) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/smore-inc/clippy.js@master/build/clippy.css">
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/smore-inc/clippy.js@master/build/clippy.min.js"></script>

<style>
  :root{
    --win: #c3c7cb; --win-light:#dfe3e6; --win-dark:#87888f; --win-darker:#4d4d54;
    --title1:#0a246a; --title2:#3a6ea5; --field:#ffffff; --text:#000000;
    --clip-yellow:#ffffcc;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(135deg,#245edb,#3a6ea5 60%,#5a86c5);
    font-family:"Tahoma","MS Sans Serif","Segoe UI",sans-serif; font-size:13px; color:var(--text);
    overflow:hidden;
  }

  /* ---- Windows 9x window chrome ---- */
  .win{
    position:absolute; background:var(--win);
    border:2px solid; border-color:var(--win-light) var(--win-darker) var(--win-darker) var(--win-light);
    box-shadow:1px 1px 0 var(--win-dark), inset 1px 1px 0 var(--win);
    padding:2px; display:flex; flex-direction:column;
  }
  .titlebar{
    background:linear-gradient(90deg,var(--title1),var(--title2));
    color:#fff; font-weight:bold; padding:3px 4px 3px 6px; display:flex; align-items:center; gap:6px;
    cursor:move; user-select:none; font-size:13px;
  }
  .titlebar .ico{width:16px;height:16px;flex:0 0 16px;}
  .titlebar .t{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tbtn{
    width:18px;height:18px;line-height:14px;text-align:center;
    background:var(--win); color:#000; font-weight:bold; font-size:11px;
    border:2px solid; border-color:var(--win-light) var(--win-darker) var(--win-darker) var(--win-light);
    cursor:pointer;
  }
  .tbtn:active{border-color:var(--win-darker) var(--win-light) var(--win-light) var(--win-darker);}

  /* ---- Chat / speech window ---- */
  #chat{ width:min(420px,calc(100vw - 24px)); left:24px; top:24px; height:min(70vh,560px); }
  #log{
    flex:1; background:var(--field); margin:4px; padding:6px; overflow-y:auto;
    border:2px solid; border-color:var(--win-darker) var(--win-light) var(--win-light) var(--win-darker);
    display:flex; flex-direction:column; gap:8px;
  }
  .msg{max-width:88%; padding:6px 9px; line-height:1.4; word-wrap:break-word; border-radius:2px;}
  .msg.clip{ align-self:flex-start; background:var(--clip-yellow); border:1px solid #d6d600; box-shadow:1px 1px 0 #cfcf7a;}
  .msg.me{ align-self:flex-end; background:#e7edf7; border:1px solid #9fb6d6;}
  .msg .who{display:block; font-size:10px; color:#555; margin-bottom:2px; letter-spacing:.3px;}
  .msg.clip .who{color:#8a7a00;}
  .dots span{animation:blink 1.2s infinite; }
  .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

  .inputrow{display:flex; gap:4px; margin:0 4px 4px;}
  #box{
    flex:1; font-family:inherit; font-size:13px; padding:4px 6px; background:var(--field);
    border:2px solid; border-color:var(--win-darker) var(--win-light) var(--win-light) var(--win-darker); outline:none;
  }
  .btn{
    font-family:inherit; font-size:13px; padding:4px 12px; min-width:64px; background:var(--win); cursor:pointer;
    border:2px solid; border-color:var(--win-light) var(--win-darker) var(--win-darker) var(--win-light);
  }
  .btn:active{border-color:var(--win-darker) var(--win-light) var(--win-light) var(--win-darker);}
  .btn:focus{outline:1px dotted #000; outline-offset:-4px;}
  .row2{display:flex; align-items:center; gap:6px; margin:0 4px 4px; font-size:11px; color:#333;}

  /* ---- Show Everything window ---- */
  #showcase{ width:min(300px,calc(100vw - 24px)); right:24px; top:24px; max-height:min(80vh,620px); }
  .sc-body{padding:6px; display:flex; flex-direction:column; gap:6px; min-height:0;}
  .sc-row{display:flex; gap:6px; align-items:flex-end;}
  label.f{display:flex; flex-direction:column; gap:2px; font-size:12px;}
  label.f select{
    font-family:inherit; font-size:13px; padding:3px 5px; background:var(--field);
    border:2px solid; border-color:var(--win-darker) var(--win-light) var(--win-light) var(--win-darker); outline:none;
  }
  .sc-count{font-size:11px; color:#333; padding:0 2px;}
  .anim-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:4px; overflow-y:auto; padding:4px;
    background:var(--field);
    border:2px solid; border-color:var(--win-darker) var(--win-light) var(--win-light) var(--win-darker);
  }
  .btn.anim{min-width:0; font-size:11px; padding:3px 4px; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
</style>
</head>
<body>

<!-- Chat / speech window -->
<div class="win" id="chat">
  <div class="titlebar" data-drag="chat">
    <svg class="ico" viewBox="0 0 16 16"><path d="M6 1.5a2.5 2.5 0 0 1 5 0V10a1.5 1.5 0 0 1-3 0V4H7v6a3 3 0 0 0 6 0V1.5a4 4 0 0 0-8 0V11a2 2 0 0 0 2 2h0" fill="none" stroke="#ffe14d" stroke-width="1.4"/></svg>
    <span class="t">Clippit &mdash; Office Assistant</span>
    <span class="tbtn" id="btnMute" title="Mute sounds">&#128266;</span>
    <span class="tbtn" id="btnClose" title="Shut Clippy down">&#10005;</span>
  </div>
  <div id="log"></div>
  <div class="inputrow">
    <input id="box" type="text" autocomplete="off" placeholder="Say something to Clippy...">
    <button class="btn" id="send">Send</button>
  </div>
  <div class="row2">
    <span id="status">&#128206; Clippit is here</span>
  </div>
</div>

<!-- Show Everything: agent picker + every animation -->
<div class="win" id="showcase">
  <div class="titlebar" data-drag="showcase">
    <span class="t">Show Everything &mdash; Assistants &amp; Animations</span>
  </div>
  <div class="sc-body">
    <div class="sc-row">
      <label class="f" style="flex:1">Assistant
        <select id="agentPick">
          <option>Clippy</option><option>Merlin</option><option>Rover</option><option>Links</option>
          <option>Bonzi</option><option>F1</option><option>Genie</option><option>Genius</option>
          <option>Peedy</option><option>Rocky</option>
        </select>
      </label>
      <button class="btn" id="playAll" title="Play every animation in order">&#9654; Play all</button>
      <button class="btn" id="playRand" title="Random animation">&#127922; Random</button>
    </div>
    <div class="sc-count"><span id="animCount">&mdash;</span> &middot; click any to watch it</div>
    <div id="animList" class="anim-grid"></div>
  </div>
</div>

<script>
"use strict";

const byId = id => document.getElementById(id);
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ============================ Speech log ============================ */
const log = byId("log");
function addMsg(who, text, cls){
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = '<span class="who">' + who + '</span>';
  el.appendChild(document.createTextNode(text));
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}
function setStatus(t){ byId("status").innerHTML = t; }

/* ============================ Clippy's classic personality (scripted) ============================ */
// Keyword rules first, then random fallbacks — the authentic "It looks like you're..." gags.
const RULES = [
  { re:/\b(hi|hello|hey|yo|howdy|hiya)\b/,            say:"Well hello there! It looks like you're ready to get something done. Or to poke me. Either works. 📎", anim:"Wave" },
  { re:/\b(bye|goodbye|see ya|later|cya)\b/,          say:"Leaving so soon? I'll be right here, wiggling in the corner. 📎", anim:"GoodBye" },
  { re:/\b(thank|thanks|ty|cheers)\b/,                say:"Aw, you're welcome! Helping is what I do best — right after getting in the way.", anim:"Congratulate" },
  { re:/\b(letter|write|writing|essay|resume|cover)\b/, say:"It looks like you're writing a letter! Would you like some help with that?", anim:"GestureRight" },
  { re:/\b(help|how do|how to|stuck|confused)\b/,     say:"It looks like you need a hand! Try clicking any of my animations in the Show Everything window — I've got dozens.", anim:"GetAttention" },
  { re:/\b(who are you|your name|what are you)\b/,     say:"I'm Clippit — but everyone calls me Clippy. The world's most famous paperclip, at your service! 📎", anim:"Explain" },
  { re:/\b(joke|funny|bored|boring)\b/,               say:"Why did the paperclip get the promotion? He was great at holding things together! ...I'll see myself out.", anim:"GetAttention" },
  { re:/\b(weather|time|news|today)\b/,               say:"It looks like you're asking about the outside world! Sadly I live in a 1997 office suite. Try a window — the glass kind.", anim:"LookUp" },
  { re:/\b(annoying|hate|go away|close|quit)\b/,      say:"Ouch! It looks like you're writing a complaint... about me. A classic. I'll be right here if you change your mind.", anim:"IdleHeadScratch" },
  { re:/\b(save|print|file|document|excel|word)\b/,   say:"It looks like you're being productive! Don't forget to save — I've seen too many documents lost to a stray coffee.", anim:"Save" },
  { re:/\b(love|awesome|cool|great|nice)\b/,          say:"Aw, shucks. It looks like you're being nice to me. That's rarer than a working floppy disk!", anim:"Pleased" }
];
const FALLBACKS = [
  { say:"It looks like you're typing something! Would you like help? 📎", anim:"GestureUp" },
  { say:"Hmm, interesting! I'd file that under 'things a good paperclip remembers.'", anim:"Thinking" },
  { say:"You know, I held together a lot of very important documents in my day.", anim:"IdleRopePile" },
  { say:"It looks like you're keeping me company. I appreciate that. 📎", anim:"CheckingSomething" },
  { say:"Tell me more! Or click one of my animations — I do love showing off.", anim:"GetArtsy" },
  { say:"Did you know I have a whole family of assistants? Try the Assistant menu on the right!", anim:"Explain" },
  { say:"It looks like you're thinking hard. Take a break — I'll juggle for you.", anim:"IdleAtom" }
];
function clippyReply(text){
  const t = text.toLowerCase();
  for (const r of RULES){ if (r.re.test(t)) return r; }
  return pick(FALLBACKS);
}

/* ============================ The real Clippy (clippy.js) ============================ */
const AGENT_BASE = "https://cdn.jsdelivr.net/gh/smore-inc/clippy.js@master/agents/";
// This build of clippy.js has NO base_path argument on clippy.load() — it always uses
// clippy.BASE_PATH (which defaults to a dead s3.amazonaws.com URL). So we override it here.
if (window.clippy) clippy.BASE_PATH = AGENT_BASE;

/* ---- Mute toggle: hook clippy.js sound playback (works for every agent) ---- */
if (window.clippy && clippy.Animator && clippy.Animator.prototype && !clippy.Animator.prototype.__mutePatched){
  const _origPlaySound = clippy.Animator.prototype._playSound;
  clippy.Animator.prototype._playSound = function(){ if (window.__clippyMuted) return; return _origPlaySound.apply(this, arguments); };
  clippy.Animator.prototype.__mutePatched = true;
}
let muted = false;
try { muted = localStorage.getItem("clippy_muted") === "1"; } catch(e){}
function setMuted(v){
  muted = !!v;
  window.__clippyMuted = muted;
  try { localStorage.setItem("clippy_muted", muted ? "1" : "0"); } catch(e){}
  const b = byId("btnMute");
  if (b){ b.innerHTML = muted ? "&#128263;" : "&#128266;"; b.title = muted ? "Sound muted — click to unmute" : "Mute sounds"; }
}
byId("btnMute").onclick = () => setMuted(!muted);
setMuted(muted); // apply persisted state before the agent loads
let agent = null, idleTimer = null, currentName = "Clippy", shutDown = false;
const THINK = ["Thinking","Processing","Searching","GestureUp","Writing"];
function safePlay(name){ try { if (agent) agent.play(name); } catch(e){} }
function clipThink(){ safePlay(pick(THINK)); }

function buildAnimList(a){
  const wrap = byId("animList"); if (!wrap) return; wrap.innerHTML = "";
  let anims = []; try { anims = a.animations().slice().sort(); } catch(e){}
  byId("animCount").textContent = anims.length + " animations";
  anims.forEach(n => {
    const b = document.createElement("button");
    b.className = "btn anim"; b.textContent = n; b.title = n;
    b.onclick = () => { try { a.stop(); } catch(e){} try { a.play(n); } catch(e){} };
    wrap.appendChild(b);
  });
}

/* ---- Idle fidget + full shutdown (stop animations AND sounds) ---- */
function startIdle(){
  if (idleTimer) clearInterval(idleTimer);
  idleTimer = setInterval(() => {
    if (!shutDown && !document.hidden && agent && Math.random() < 0.45) { try { agent.animate(); } catch(e){} }
  }, 15000);
}
function silenceAgent(a){
  // hard-stop any in-flight clippy.js sound effects
  try { const an = a && a._animator; if (an && an._sounds){ for (const k in an._sounds){ try { an._sounds[k].pause(); an._sounds[k].currentTime = 0; } catch(e){} } } } catch(e){}
}
function stopAgent(a){
  if (!a) return;
  try { a.stopCurrent(); } catch(e){}
  try { a.stop(); } catch(e){}
  try { a.pause(); } catch(e){}
  silenceAgent(a);
}
function shutdownClippy(){
  shutDown = true;
  if (idleTimer){ clearInterval(idleTimer); idleTimer = null; }
  window.__clippyMuted = true;                 // block any queued sounds immediately
  stopAgent(agent);
  if (agent){ try { agent.hide(true, function(){}); } catch(e){} }
  try { document.querySelectorAll(".clippy, .clippy-balloon").forEach(n => n.remove()); } catch(e){}
  agent = null;
  setStatus('&#9899; Clippy is off &middot; <span id="wake" style="color:#0a246a;text-decoration:underline;cursor:pointer">Wake Clippy</span>');
  const w = byId("wake"); if (w) w.onclick = wakeClippy;
}
function wakeClippy(){
  shutDown = false;
  setMuted(muted);                             // restore your mute preference
  loadAgent(byId("agentPick") ? byId("agentPick").value : "Clippy");
}

function loadAgent(name){
  if (!(window.clippy && typeof clippy.load === "function")){
    setStatus("&#9888;&#65039; clippy.js couldn't load (need internet).");
    return;
  }
  if (agent){ try { agent.hide(true, function(){}); } catch(e){} }
  try { document.querySelectorAll(".clippy, .clippy-balloon").forEach(n => n.remove()); } catch(e){}
  agent = null;
  setStatus("&#128260; Loading " + name + "...");
  clippy.load(name, function(a){
    agent = a; currentName = name; shutDown = false;
    a.show();
    buildAnimList(a);
    setTimeout(() => safePlay("Greeting"), 300);
    setTimeout(() => {
      const hi = name === "Clippy"
        ? "Hi! It looks like you're checking me out. 📎 I'm Clippit, your Office Assistant. Say something below, or watch my animations!"
        : "Hi! I'm " + name + ", one of Clippy's old office pals. Watch my animations on the right!";
      try { a.speak(hi); } catch(e){}
      safePlay("Wave");
    }, 850);
    startIdle();
    setStatus("&#128206; " + name + " is here &middot; " + (a.animations ? a.animations().length : 0) + " animations");
  }, function(err){
    setStatus("&#9888;&#65039; Couldn't load " + name + " sprites (need internet).");
  });
}

/* ============================ Talk to Clippy ============================ */
let busy = false;
function send(){
  const text = byId("box").value.trim();
  if (!text || busy) return;
  byId("box").value = "";
  addMsg("You", text, "me");
  busy = true; byId("send").disabled = true;

  const thinking = document.createElement("div");
  thinking.className = "msg clip";
  thinking.innerHTML = '<span class="who">Clippy</span><span class="dots"><span>&#9679;</span><span>&#9679;</span><span>&#9679;</span></span>';
  log.appendChild(thinking); log.scrollTop = log.scrollHeight;
  clipThink();

  const r = clippyReply(text);
  setTimeout(() => {
    thinking.remove();
    addMsg("Clippy", r.say, "clip");
    safePlay(r.anim);
    if (agent){ try { agent.speak(r.say); } catch(e){} }
    busy = false; byId("send").disabled = false; byId("box").focus();
  }, 650);
}
byId("send").onclick = send;
byId("box").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

/* ============================ Show-Everything controls ============================ */
byId("agentPick").addEventListener("change", e => loadAgent(e.target.value));
byId("playRand").onclick = () => { try { agent && agent.animate(); } catch(e){} };
byId("playAll").onclick = () => {
  if (!agent) return;
  let anims = []; try { anims = agent.animations(); } catch(e){}
  anims.forEach(n => { try { agent.play(n); } catch(e){} }); // clippy.js queues them in order
};

/* ============================ Shutdown / go-quiet ============================ */
byId("btnClose").onclick = shutdownClippy;
// When the tab is hidden or the window loses focus, stop animating and go silent.
document.addEventListener("visibilitychange", () => {
  if (document.hidden){
    if (idleTimer){ clearInterval(idleTimer); idleTimer = null; }
    if (agent){ try { agent.stopCurrent(); } catch(e){} try { agent.pause(); } catch(e){} silenceAgent(agent); }
  } else if (!shutDown && agent){
    try { agent.resume(); } catch(e){}
    startIdle();
  }
});
// When the page is closed/navigated away, stop everything hard.
function shutdownHard(){
  if (idleTimer){ clearInterval(idleTimer); idleTimer = null; }
  window.__clippyMuted = true;
  stopAgent(agent);
}
window.addEventListener("pagehide", shutdownHard);
window.addEventListener("beforeunload", shutdownHard);

/* ============================ Draggable windows ============================ */
(function(){
  let drag = null, ox=0, oy=0;
  document.querySelectorAll(".titlebar").forEach(tb => {
    tb.addEventListener("mousedown", e => {
      if (e.target.classList.contains("tbtn")) return;
      const win = tb.parentElement; const r = win.getBoundingClientRect();
      drag = win; ox = e.clientX - r.left; oy = e.clientY - r.top; win.style.zIndex = 60;
      e.preventDefault();
    });
  });
  window.addEventListener("mousemove", e => {
    if (!drag) return;
    drag.style.left = Math.max(0, Math.min(window.innerWidth - 60, e.clientX - ox)) + "px";
    drag.style.top  = Math.max(0, Math.min(window.innerHeight - 30, e.clientY - oy)) + "px";
    drag.style.right = "auto";
  });
  window.addEventListener("mouseup", () => drag = null);
})();

/* ============================ boot ============================ */
addMsg("Clippy", "Hi! I'm Clippy — your Office Assistant. 📎  Type me a message below, or play with all my animations in the “Show Everything” window.", "clip");
loadAgent("Clippy");
byId("box").focus();
</script>
</body>
</html>
